name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:   # the defaults live under /var/lib/agentlimit (root on the VM); CI runs unprivileged
      LEDGER_DIR: /tmp/agentlimit/ledger
      SIGNER_KEY_PATH: /tmp/agentlimit/keys/evidence.ed25519
      USAGE_DB_PATH: /tmp/agentlimit/usage.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q   # kernel tests skip without root + cgroup v2

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test          # state-accuracy rules (src/plain.test.ts)
      - run: npm run build     # type-check + production build
