# Installed to /etc/nginx/sites-available/agentlimit by deploy/install_vultr.sh.
# Directly internet-facing: there is NO trusted upstream proxy, so the client
# address is $remote_addr and any caller-supplied X-Forwarded-For is overwritten.
server {
  listen 80 default_server;
  server_name __SERVER_NAME__;
  client_max_body_size 2m;
  server_tokens off;

  location = /auth/login {
    limit_req zone=agentlimit_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Live event stream: one long-lived request; not subject to the API rate limit.
  location ~ ^/sessions/[a-z0-9]+/stream$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no;
  }

  location / {
    limit_req zone=agentlimit_api burst=80 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-Sent Events: the live governance stream must not be buffered.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
